<!--
  Formulário Smart (coworking) — HubSpot form f9c089f7-0d36-48d6-a2e6-e76cf0c2b4f1
  (portal 51922874). Bloco único para colar em um Embed, envia direto para a Forms Submissions
  API do HubSpot — mesmo padrão de código/validação do embed-v3.html, prefixo "hsm-". Etapa única
  (o formulário tem poucos campos e não precisa de divisão em passos).

  Campos e nomes internos — você passou esses nomes diretamente (sem print de "Editar campo" do
  HubSpot para confirmar), então tratei como os nomes internos reais:
    name, email, phone, produto_de_interessse, tem_contrato_social, estado_uf, unidades
    UTMs ocultos: utm_term, utm_content, utm_source, utm_medium, utm_campaign

  TODO antes de publicar:
  1) "name" não é a propriedade padrão de Contato do HubSpot (o padrão é firstname/lastname,
     como nos outros formulários deste projeto) — presumi que é uma propriedade customizada de
     nome único/completo. Confirme se é isso mesmo ou se precisa virar firstname+lastname.
  2) "produto_de_interessse" (nome com esse typo mesmo, mantive como você passou) — assumi 2
     opções (Coworking / Endereço Fiscal) como valores separados de um select; confirme se é
     assim ou se são outras opções / campo de múltipla escolha.
  3) Sem bloco de consentimento/LGPD neste formulário (não foi pedido) — avise se precisar.

  Visual baseado em coworkingsmart.com.br: azul #0D44FF, navy #000736, gradiente azul→verde
  (#0D44FF → #33D375), fontes Poppins (texto) e Titillium Web (títulos), botões em pílula.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Titillium+Web:wght@600;700&display=swap" rel="stylesheet">

<div class="hsm-wrap">
  <div class="hsm-header">
    <span class="hsm-eyebrow">Coworking Smart</span>
    <h2 class="hsm-title">Encontre o espaço <span>ideal</span> para sua empresa</h2>
    <p class="hsm-subtitle">Preencha seus dados e um consultor entra em contato.</p>
  </div>

  <form class="hsm-form" id="hsm-form" novalidate>
    <div class="hsm-field hsm-field--full">
      <label for="hsm-name">Nome<span class="hsm-req">*</span></label>
      <input type="text" id="hsm-name" name="name" autocomplete="name" required aria-describedby="hsm-name-error">
      <p class="hsm-error" id="hsm-name-error"></p>
    </div>

    <div class="hsm-field">
      <label for="hsm-email">E-mail<span class="hsm-req">*</span></label>
      <input type="email" id="hsm-email" name="email" autocomplete="email" required aria-describedby="hsm-email-error">
      <p class="hsm-error" id="hsm-email-error"></p>
    </div>

    <div class="hsm-field">
      <label for="hsm-phone">Telefone<span class="hsm-req">*</span></label>
      <div class="hsm-phone-group">
        <span class="hsm-ddi">BR&nbsp;+55</span>
        <input type="tel" id="hsm-phone" name="phone" inputmode="numeric" autocomplete="tel" required aria-describedby="hsm-phone-error">
      </div>
      <p class="hsm-error" id="hsm-phone-error"></p>
    </div>

    <div class="hsm-field">
      <label for="hsm-produto">Produto de interesse<span class="hsm-req">*</span></label>
      <select id="hsm-produto" name="produto_de_interessse" required aria-describedby="hsm-produto-error">
        <option value="">Selecione...</option>
        <option value="Coworking">Coworking</option>
        <option value="Endereço Fiscal">Endereço Fiscal</option>
      </select>
      <p class="hsm-error" id="hsm-produto-error"></p>
    </div>

    <div class="hsm-field">
      <label for="hsm-contrato">Tem contrato social?<span class="hsm-req">*</span></label>
      <select id="hsm-contrato" name="tem_contrato_social" required aria-describedby="hsm-contrato-error">
        <option value="">Selecione...</option>
        <option value="Sim">Sim</option>
        <option value="Não">Não</option>
      </select>
      <p class="hsm-error" id="hsm-contrato-error"></p>
    </div>

    <div class="hsm-field">
      <label for="hsm-estado">Estado (UF)<span class="hsm-req">*</span></label>
      <select id="hsm-estado" name="estado_uf" required aria-describedby="hsm-estado-error">
        <option value="">Selecione...</option>
        <option value="AC">Acre (AC)</option>
        <option value="AL">Alagoas (AL)</option>
        <option value="AP">Amapá (AP)</option>
        <option value="AM">Amazonas (AM)</option>
        <option value="BA">Bahia (BA)</option>
        <option value="CE">Ceará (CE)</option>
        <option value="DF">Distrito Federal (DF)</option>
        <option value="ES">Espírito Santo (ES)</option>
        <option value="GO">Goiás (GO)</option>
        <option value="MA">Maranhão (MA)</option>
        <option value="MT">Mato Grosso (MT)</option>
        <option value="MS">Mato Grosso do Sul (MS)</option>
        <option value="MG">Minas Gerais (MG)</option>
        <option value="PA">Pará (PA)</option>
        <option value="PB">Paraíba (PB)</option>
        <option value="PR">Paraná (PR)</option>
        <option value="PE">Pernambuco (PE)</option>
        <option value="PI">Piauí (PI)</option>
        <option value="RJ">Rio de Janeiro (RJ)</option>
        <option value="RN">Rio Grande do Norte (RN)</option>
        <option value="RS">Rio Grande do Sul (RS)</option>
        <option value="RO">Rondônia (RO)</option>
        <option value="RR">Roraima (RR)</option>
        <option value="SC">Santa Catarina (SC)</option>
        <option value="SP">São Paulo (SP)</option>
        <option value="SE">Sergipe (SE)</option>
        <option value="TO">Tocantins (TO)</option>
      </select>
      <p class="hsm-error" id="hsm-estado-error"></p>
    </div>

    <div class="hsm-field">
      <label for="hsm-unidade">Unidade de interesse<span class="hsm-req">*</span></label>
      <select id="hsm-unidade" name="unidades" required aria-describedby="hsm-unidade-error">
        <option value="">Selecione...</option>
        <option value="Paulista I">Paulista I</option>
        <option value="Paulista II">Paulista II</option>
        <option value="Berrini">Berrini</option>
        <option value="Savassi">Savassi</option>
        <option value="Asa Norte">Asa Norte</option>
        <option value="Asa Sul">Asa Sul</option>
        <option value="Aguas Claras">Aguas Claras</option>
        <option value="Barra da Tijuca">Barra da Tijuca</option>
      </select>
      <p class="hsm-error" id="hsm-unidade-error"></p>
    </div>

    <button type="submit" id="hsm-submit">Enviar</button>
    <p class="hsm-submit-error" id="hsm-submit-error">Não foi possível enviar seu formulário. Tente novamente.</p>
  </form>

  <div class="hsm-success" id="hsm-success">
    <span class="hsm-success-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <h3>Formulário enviado</h3>
    <p>Obrigado, entraremos em contato em breve.</p>
  </div>
</div>

<style>
  .hsm-wrap {
    --hsm-ink: #000736;
    --hsm-ink-soft: #363d67;
    --hsm-muted: #6b7190;
    --hsm-line: #dae1e8;
    --hsm-surface: #f5faff;
    --hsm-surface-hover: #ffffff;
    --hsm-brand: #0d44ff;
    --hsm-brand-dark: #0a36cc;
    --hsm-brand-ring: rgba(13, 68, 255, .16);
    --hsm-green: #33d375;
    --hsm-gradient: linear-gradient(90deg, #0d44ff 0%, #33d375 100%);
    --hsm-error: #f2281b;
    --hsm-error-bg: #fff5f4;
    --hsm-error-ring: rgba(242, 40, 27, .14);
    position: relative;
    box-sizing: border-box;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 40px 36px;
    background: #fff;
    border-radius: 32px;
    box-shadow: 0 24px 60px rgba(0, 7, 54, .10), 0 2px 6px rgba(0, 7, 54, .05);
    overflow: hidden;
    font-family: "Poppins", Arial, Helvetica, sans-serif;
    color: var(--hsm-ink);
    -webkit-font-smoothing: antialiased;
  }
  .hsm-wrap *, .hsm-wrap *::before, .hsm-wrap *::after { box-sizing: border-box; }

  .hsm-wrap::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: var(--hsm-gradient);
  }

  /* Cabeçalho */
  .hsm-header { margin-bottom: 28px; }
  .hsm-eyebrow {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 100px;
    background: #f3f6ff;
    color: var(--hsm-brand);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .hsm-title {
    margin: 14px 0 8px;
    font-family: "Titillium Web", "Poppins", sans-serif;
    font-size: 32px;
    font-weight: 700;
    line-height: 1.12;
    color: var(--hsm-ink);
  }
  .hsm-title span {
    background: var(--hsm-gradient);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .hsm-subtitle { margin: 0; font-size: 15px; line-height: 1.5; color: var(--hsm-muted); }

  /* Grid: 2 colunas no desktop, 1 no mobile */
  .hsm-form {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 16px;
    row-gap: 6px;
  }
  .hsm-field { display: flex; flex-direction: column; min-width: 0; }
  .hsm-field--full,
  #hsm-submit,
  .hsm-submit-error { grid-column: 1 / -1; }

  .hsm-field label {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--hsm-ink-soft);
    margin-bottom: 7px;
  }

  .hsm-req { color: var(--hsm-brand); margin-left: 3px; }

  .hsm-field input[type="text"],
  .hsm-field input[type="tel"],
  .hsm-field input[type="email"],
  .hsm-field select {
    width: 100%;
    height: 50px;
    border: 1.5px solid var(--hsm-line);
    background: var(--hsm-surface);
    color: var(--hsm-ink);
    border-radius: 12px;
    padding: 0 16px;
    font-size: 15px;
    line-height: 1.4;
    font-family: inherit;
    transition: border-color 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
  }

  .hsm-field input:hover,
  .hsm-field select:hover { border-color: #b9c6dc; }

  .hsm-field select {
    appearance: none;
    -webkit-appearance: none;
    padding-right: 42px;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='none'%3E%3Cpath d='M5 7.5l5 5 5-5' stroke='%230d44ff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 16px center;
    background-size: 12px 12px;
    cursor: pointer;
  }

  .hsm-field input::placeholder { color: #9aa3b8; }

  .hsm-field input:focus,
  .hsm-field select:focus {
    outline: none;
    border-color: var(--hsm-brand);
    background-color: var(--hsm-surface-hover);
    box-shadow: 0 0 0 4px var(--hsm-brand-ring);
  }

  .hsm-field input.hsm-field--invalid,
  .hsm-field select.hsm-field--invalid {
    border-color: var(--hsm-error);
    background-color: var(--hsm-error-bg);
  }

  .hsm-field input.hsm-field--invalid:focus,
  .hsm-field select.hsm-field--invalid:focus {
    box-shadow: 0 0 0 4px var(--hsm-error-ring);
  }

  .hsm-phone-group { display: flex; gap: 8px; }
  .hsm-ddi {
    display: flex; align-items: center; justify-content: center;
    height: 50px;
    border: 1.5px solid var(--hsm-line); background: #f3f6ff;
    color: var(--hsm-brand); border-radius: 12px; font-weight: 600;
    padding: 0 12px; font-size: 13.5px; white-space: nowrap;
  }
  .hsm-phone-group input { flex: 1; min-width: 0; }

  .hsm-error {
    color: var(--hsm-error);
    font-size: 12px;
    font-weight: 500;
    margin: 5px 0 0;
    min-height: 16px;
    line-height: 1.3;
  }

  #hsm-submit {
    margin-top: 10px;
    width: 100%;
    height: 56px;
    border: 0;
    border-radius: 100px;
    background: var(--hsm-gradient);
    background-size: 200% 100%;
    background-position: 0 0;
    color: #fff;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .01em;
    cursor: pointer;
    box-shadow: rgba(19, 99, 255, .25) 0 8px 30px;
    transition: background-position 300ms ease, transform 180ms ease, box-shadow 180ms ease;
  }
  #hsm-submit:hover:not(:disabled) {
    background-position: 100% 0;
    transform: translateY(-2px);
    box-shadow: rgba(19, 99, 255, .35) 0 12px 36px;
  }
  #hsm-submit:active:not(:disabled) { transform: translateY(0); }
  #hsm-submit:focus-visible { outline: 3px solid var(--hsm-brand-ring); outline-offset: 3px; }
  #hsm-submit:disabled { opacity: .6; cursor: not-allowed; box-shadow: none; }

  .hsm-submit-error {
    display: none;
    margin: 10px 0 0;
    padding: 12px 16px;
    border-radius: 12px;
    background: var(--hsm-error-bg);
    color: var(--hsm-error);
    font-size: 13.5px;
    font-weight: 500;
    text-align: center;
  }
  .hsm-submit-error.show { display: block; }

  /* Sucesso */
  .hsm-success {
    display: none;
    padding: 32px 24px;
    border-radius: 24px;
    background: #f3f6ff;
    color: var(--hsm-ink);
    text-align: center;
    font-size: 15px;
  }
  .hsm-success-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 64px;
    height: 64px;
    margin-bottom: 16px;
    border-radius: 100px;
    background: var(--hsm-gradient);
    box-shadow: rgba(51, 211, 117, .3) 0 10px 30px;
  }
  .hsm-success-icon svg { width: 30px; height: 30px; }
  .hsm-success h3 {
    margin: 0 0 6px;
    font-family: "Titillium Web", "Poppins", sans-serif;
    font-size: 26px;
    font-weight: 700;
  }
  .hsm-success p { margin: 0; color: var(--hsm-muted); }

  @media (max-width: 560px) {
    .hsm-wrap { padding: 32px 20px 24px; border-radius: 24px; }
    .hsm-title { font-size: 26px; }
    .hsm-form { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hsm-wrap * { transition: none !important; }
  }
</style>

<script>
(function () {
  var HUBSPOT = {
    portalId: '51922874',
    formId: 'f9c089f7-0d36-48d6-a2e6-e76cf0c2b4f1',
    endpoint: 'https://api.hsforms.com/submissions/v3/integration/submit'
  };

  var UTM_KEYS = ['utm_term', 'utm_content', 'utm_source', 'utm_medium', 'utm_campaign'];

  var form = document.getElementById('hsm-form');
  if (!form) return;

  var success = document.getElementById('hsm-success');
  var submitBtn = document.getElementById('hsm-submit');
  var submitError = document.getElementById('hsm-submit-error');

  var name = form.querySelector('#hsm-name');
  var email = form.querySelector('#hsm-email');
  var phone = form.querySelector('#hsm-phone');
  var produto = form.querySelector('#hsm-produto');
  var contrato = form.querySelector('#hsm-contrato');
  var estado = form.querySelector('#hsm-estado');
  var unidade = form.querySelector('#hsm-unidade');

  function digitsOnly(value) {
    return value.replace(/\D/g, '');
  }

  function maskPhone(value) {
    var digits = digitsOnly(value).slice(0, 11);
    if (!digits.length) return '';
    if (digits.length <= 2) return '(' + digits;
    if (digits.length <= 6) return '(' + digits.slice(0, 2) + ') ' + digits.slice(2);
    if (digits.length <= 10) return '(' + digits.slice(0, 2) + ') ' + digits.slice(2, 6) + '-' + digits.slice(6);
    return '(' + digits.slice(0, 2) + ') ' + digits.slice(2, 7) + '-' + digits.slice(7);
  }

  function validateName() {
    var value = name.value.trim();
    if (!value) return 'Informe seu nome.';
    if (value.length < 2) return 'Informe pelo menos 2 caracteres.';
    return '';
  }

  function validateEmail() {
    var value = email.value.trim();
    if (!value) return 'Informe seu e-mail.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value)) return 'Informe um e-mail válido.';
    return '';
  }

  function validatePhone() {
    var digits = digitsOnly(phone.value);
    if (!digits.length) return 'Informe seu telefone.';
    if (digits.length < 10 || digits.length > 11) return 'Informe um telefone válido com DDD.';
    if (digits.length === 11 && digits.charAt(2) !== '9') return 'Celular deve começar com 9 após o DDD.';
    return '';
  }

  function validateSelect(el) {
    if (!el.value) return 'Selecione uma opção.';
    return '';
  }

  var fieldList = [
    { el: name, errorId: 'hsm-name-error', validate: validateName },
    { el: email, errorId: 'hsm-email-error', validate: validateEmail },
    { el: phone, errorId: 'hsm-phone-error', validate: validatePhone },
    { el: produto, errorId: 'hsm-produto-error', validate: function () { return validateSelect(produto); } },
    { el: contrato, errorId: 'hsm-contrato-error', validate: function () { return validateSelect(contrato); } },
    { el: estado, errorId: 'hsm-estado-error', validate: function () { return validateSelect(estado); } },
    { el: unidade, errorId: 'hsm-unidade-error', validate: function () { return validateSelect(unidade); } }
  ];

  function setFieldState(el, errorId, message) {
    var errorEl = document.getElementById(errorId);
    var isValid = !message;
    el.classList.toggle('hsm-field--invalid', !isValid);
    el.setAttribute('aria-invalid', isValid ? 'false' : 'true');
    if (errorEl) errorEl.textContent = message || '';
  }

  function validateField(field) {
    var message = field.validate();
    setFieldState(field.el, field.errorId, message);
    return !message;
  }

  function validateForm() {
    var isValid = true;
    fieldList.forEach(function (field) {
      if (!validateField(field)) isValid = false;
    });
    return isValid;
  }

  phone.addEventListener('input', function () {
    var cursorFromEnd = phone.value.length - phone.selectionStart;
    phone.value = maskPhone(phone.value);
    var nextPos = Math.max(phone.value.length - cursorFromEnd, 0);
    phone.setSelectionRange(nextPos, nextPos);
  });

  fieldList.forEach(function (field) {
    var eventName = field.el.tagName === 'SELECT' ? 'change' : 'input';
    field.el.addEventListener('blur', function () { validateField(field); });
    field.el.addEventListener(eventName, function () {
      if (field.el.classList.contains('hsm-field--invalid')) validateField(field);
    });
  });

  function getHubspotUtk() {
    var match = document.cookie.match(/(?:^|;\s*)hubspotutk=([^;]+)/);
    return match ? match[1] : '';
  }

  function getUtms() {
    var params = new URLSearchParams(window.location.search);
    var utms = {};
    UTM_KEYS.forEach(function (key) {
      utms[key] = params.get(key) || '';
    });
    return utms;
  }

  function buildHubspotFields(lead) {
    var fields = [
      { name: 'name', value: lead.name },
      { name: 'email', value: lead.email },
      { name: 'phone', value: lead.phone },
      { name: 'produto_de_interessse', value: lead.produto },
      { name: 'tem_contrato_social', value: lead.contrato },
      { name: 'estado_uf', value: lead.estado },
      { name: 'unidades', value: lead.unidade }
    ];

    UTM_KEYS.forEach(function (key) {
      var value = lead.utms[key];
      if (value) fields.push({ name: key, value: value });
    });

    return fields;
  }

  function submitToHubspot(lead) {
    var hutk = getHubspotUtk();
    var context = { pageUri: window.location.href, pageName: document.title };
    if (hutk) context.hutk = hutk;

    return fetch(HUBSPOT.endpoint + '/' + HUBSPOT.portalId + '/' + HUBSPOT.formId, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        submittedAt: Date.now(),
        fields: buildHubspotFields(lead),
        context: context
      })
    }).then(function (response) {
      if (!response.ok) {
        return response.json().catch(function () { return {}; }).then(function (error) {
          throw new Error(error.message || 'Erro ao enviar formulário');
        });
      }
      return response.json();
    });
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();

    if (!validateForm()) {
      var firstInvalid = form.querySelector('.hsm-field--invalid');
      if (firstInvalid && firstInvalid.focus) firstInvalid.focus();
      return;
    }

    submitError.classList.remove('show');

    var lead = {
      name: name.value.trim(),
      email: email.value.trim(),
      phone: '+55' + digitsOnly(phone.value),
      produto: produto.value,
      contrato: contrato.value,
      estado: estado.value,
      unidade: unidade.value,
      utms: getUtms()
    };

    var originalLabel = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando...';

    submitToHubspot(lead).then(function () {
      if (typeof fbq === 'function') fbq('track', 'Lead');
      form.style.display = 'none';
      success.style.display = 'block';
    }).catch(function (err) {
      console.error('HubSpot submit error:', err);
      submitBtn.disabled = false;
      submitBtn.textContent = originalLabel;
      submitError.classList.add('show');
    });
  });
})();
</script>
